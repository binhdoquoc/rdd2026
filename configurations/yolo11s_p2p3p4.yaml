# Ultralytics YOLO11 object detection model with P2/4, P3/8, P4/16 outputs
# Optimized for tiny/small objects ONLY (P5 removed)

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
scale: s
# YOLO11 backbone (Stopped at P4)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4   <-- Backbone P2
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8   <-- Backbone P3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  <-- Backbone P4
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, SPPF, [512, 5]] # 7 (SPPF applied to P4 instead of P5)
  - [-1, 2, C2PSA, [512]] # 8

# YOLO11-P2 (No P5) head
head:
  # --- TOP-DOWN PATHWAY ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9 (Upsample P4 to P3 size)
  - [[-1, 4], 1, Concat, [1]] # 10 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (Upsample P3 to P2 size)
  - [[-1, 2], 1, Concat, [1]] # 13 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 14 (P2/4-xsmall) -> FIRST DETECT HEAD

  # --- BOTTOM-UP PATHWAY ---
  - [-1, 1, Conv, [128, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small) -> SECOND DETECT HEAD

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P4 (final SPPF layer)
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium) -> THIRD DETECT HEAD

  # Detection Head updated to track 3 layers: [P2, P3, P4]
  - [[14, 17, 20], 1, Detect, [nc]] # 21 Detect(P2, P3, P4)