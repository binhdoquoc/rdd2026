# Ultralytics YOLO11 object detection model with P2/4 - P5/32 outputs
# Modified for small/thin road-crack detection by adding a P2 detection head.
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes; change to 4 for RDD2022 road damage if needed

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

scale: s # force YOLO11s scale

# YOLO11s backbone
backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

# YOLO11s head with P2 detection layer
head:
  # -------------------------
  # Top-down FPN path
  # -------------------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11: P5 -> P4
  - [[-1, 6], 1, Concat, [1]]                   # 12: cat backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13: P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14: P4 -> P3
  - [[-1, 4], 1, Concat, [1]]                   # 15: cat backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 16: P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17: P3 -> P2
  - [[-1, 2], 1, Concat, [1]]                   # 18: cat backbone P2
  - [-1, 2, C3k2, [128, False]]                 # 19: P2/4 tiny-small

  # -------------------------
  # Bottom-up PAN path
  # -------------------------

  - [-1, 1, Conv, [128, 3, 2]]                  # 20: P2 -> P3
  - [[-1, 16], 1, Concat, [1]]                  # 21: cat head P3
  - [-1, 2, C3k2, [256, False]]                 # 22: P3/8 small

  - [-1, 1, Conv, [256, 3, 2]]                  # 23: P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                  # 24: cat head P4
  - [-1, 2, C3k2, [512, False]]                 # 25: P4/16 medium

  - [-1, 1, Conv, [512, 3, 2]]                  # 26: P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                  # 27: cat backbone/head P5
  - [-1, 2, C3k2, [1024, True]]                 # 28: P5/32 large

  # Detect on P2, P3, P4, P5
  - [[19, 22, 25, 28], 1, Detect, [nc]]         # 29: Detect(P2, P3, P4, P5)
